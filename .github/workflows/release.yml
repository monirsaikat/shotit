name: Release

# Push a version tag or run by hand with a version such as 1.2.0.
# It builds every installer and publishes a GitHub release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 1.2.0
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build installers
        shell: pwsh
        env:
          # Optional. Arguments for "signtool sign", for example:
          #   /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f cert.pfx /p <password>
          # Without this secret the release is built unsigned and Windows SmartScreen will warn users.
          SIGN_PARAMS: ${{ secrets.SIGN_PARAMS }}
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          $repo = 'https://github.com/${{ github.repository }}'
          $arguments = @{
            Version       = $version
            UpdateFeedUrl = $repo
            PackageUrl    = "$repo/releases/download/v$version"
          }
          if ($env:SIGN_PARAMS) { $arguments.SignParams = $env:SIGN_PARAMS }
          ./build/package.ps1 @arguments

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts/release -File | ForEach-Object FullName
          # The update feed files must sit beside the installers for the in-app updater to find them.
          $files += Get-ChildItem artifacts/release/feed -File | ForEach-Object FullName
          $version = $env:RELEASE_VERSION -replace '^v', ''
          gh release create "v$version" $files --title "ShotIt v$version" --generate-notes

      - name: Keep the winget manifest
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifest
          path: artifacts/release/winget
          if-no-files-found: ignore
